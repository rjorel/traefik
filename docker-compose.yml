services:
  reverse_proxy:
    image: traefik:latest
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./letsencrypt:/letsencrypt

    command:
      - --api=true

      - --log=true
      - --log.level=INFO

      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=web-secure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https

      - --entryPoints.web-secure.address=:443
      - --entryPoints.web-secure.http.tls.certResolver=default-resolver

      - --certificatesResolvers.default-resolver.acme.email=${TRAEFIK_EMAIL}
      - --certificatesResolvers.default-resolver.acme.storage=/letsencrypt/acme.json
      - --certificatesResolvers.default-resolver.acme.httpChallenge.entrypoint=web

      - --metrics.prometheus=true

      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.watch=true
      - --providers.docker.swarmMode=false

    labels:
      traefik.enable: true

      traefik.http.routers.traefik-ui.rule: Host(`${TRAEFIK_HOSTNAME}`)
      traefik.http.routers.traefik-ui.middlewares: traefik-auth
      traefik.http.routers.traefik-ui.service: api@internal

      traefik.http.middlewares.traefik-auth.basicauth.users: ${TRAEFIK_BASIC_AUTH}
      traefik.http.middlewares.traefik-auth.basicauth.removeheader: true

    networks:
      - webproxy
      - default

  nginx_error_pages:
    image: nginx:stable-alpine
    restart: always
    volumes:
      - ./nginx/error-pages:/usr/share/nginx/error-pages
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    labels:
      traefik.enable: true

      traefik.http.routers.error-router.rule: HostRegexp(`{host:.+}`)
      traefik.http.routers.error-router.priority: 1
      traefik.http.routers.error-router.middlewares: error-pages-middleware

      traefik.http.middlewares.error-pages-middleware.errors.status: 404
      traefik.http.middlewares.error-pages-middleware.errors.service: error-pages-service
      traefik.http.middlewares.error-pages-middleware.errors.query: /{status}.html

      traefik.http.services.error-pages-service.loadbalancer.server.port: 80

    networks:
      - default

  prometheus:
    image: prom/prometheus:latest
    restart: always
    volumes:
      - ./prometheus/:/etc/prometheus/
      - prometheus_data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.size=256MB'

    labels:
      traefik.enable: true

      traefik.http.routers.prometheus.rule: Host(`${PROMETHEUS_HOSTNAME}`)
      traefik.http.routers.prometheus.middlewares: traefik-auth
      traefik.http.services.prometheus.loadbalancer.server.port: 9090
       
    networks:
      - default

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./grafana/provisioning/:/etc/grafana/provisioning/
      - grafana_data:/var/lib/grafana

    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    labels:
      traefik.enable: true

      traefik.http.routers.grafana.rule: Host(`${GRAFANA_HOSTNAME}`)
      traefik.http.routers.grafana.middlewares: traefik-auth
      traefik.http.services.grafana.loadbalancer.server.port: 3000
    
    networks:
      - default

volumes:
  prometheus_data:
  grafana_data:

networks:
  webproxy:
